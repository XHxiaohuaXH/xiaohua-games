
name: Purge jsDelivr Cache (Best Effort)

on:
  push:
    branches: [main]
    paths:
      - 'xiaohuagames.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 请求 jsDelivr 缓存刷新（尽力而为）
        shell: bash
        run: |
          set -uo pipefail

          URL="https://purge.jsdelivr.net/gh/XHxiaohuaXH/xiaohua-games@main/xiaohuagames.json"
          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT

          echo "请求刷新：$URL"

          CODE=$(curl -sS \
            --max-time 30 \
            --retry 2 \
            --retry-delay 3 \
            -o "$BODY_FILE" \
            -w "%{http_code}" \
            "$URL") || {
              echo "::warning::Purge 请求发生网络错误，跳过刷新。"
              echo "::notice::@main 将按照 jsDelivr 分支缓存策略更新。"
              exit 0
            }

          echo "HTTP 状态码：$CODE"
          echo "响应内容："
          cat "$BODY_FILE"

          if [ "$CODE" != "200" ]; then
            echo "::warning::Purge 请求失败（HTTP $CODE）。"
            echo "::notice::CDN 将按照分支缓存策略更新。"
            exit 0
          fi

          echo "Purge 请求已返回 HTTP 200。"
          echo "::notice::注意：@main 不保证立即刷新，不能据此确认 CDN 已返回最新内容。"

      
      - name: 验证三个数据源的缓存情况
        shell: bash
        run: |
          set -uo pipefail

          check_source() {
            local name="$1"
            local url="$2"
            local file
            file=$(mktemp)

            echo ""
            echo "========================================"
            echo "数据源：$name"

            for mode in normal random; do
              echo ""
              echo "---------- $mode 请求 ----------"

              local request_url="$url"

              if [ "$mode" = "random" ]; then
                request_url="${url}?verify=$(date +%s%N)"
              fi

              if ! curl -fsSL \
                --max-time 20 \
                --retry 1 \
                "$request_url" \
                -o "$file"; then
                echo "::warning::$name 的 $mode 请求失败"
                continue
              fi

              python3 - "$file" "$name" "$mode" <<'PY'
          import json
          import sys
          import hashlib

          path, name, mode = sys.argv[1:4]

          try:
              with open(path, "rb") as f:
                  raw = f.read()

              data = json.loads(raw.decode("utf-8-sig"))
              games = data.get("games", [])

              print("数据源：", name)
              print("请求方式：", mode)
              print("游戏总数量：", len(games))
              print("文件 SHA256：", hashlib.sha256(raw).hexdigest())

              found = False
              for game in games:
                  if isinstance(game, dict) and game.get("name") == "AI少女":
                      found = True
                      print("AI少女完整数据：")
                      print(json.dumps(game, ensure_ascii=False, indent=2))
                      break

              if not found:
                  print("没有找到 AI少女")

          except Exception as e:
              print("解析失败：", e)
          PY
            done

            rm -f "$file"
          }

          check_source \
            "jsDelivr" \
            "https://cdn.jsdelivr.net/gh/XHxiaohuaXH/xiaohua-games@main/xiaohuagames.json"

          check_source \
            "Gcore" \
            "https://gcore.jsdelivr.net/gh/XHxiaohuaXH/xiaohua-games@main/xiaohuagames.json"

          check_source \
            "GitHub Raw" \
            "https://raw.githubusercontent.com/XHxiaohuaXH/xiaohua-games/main/xiaohuagames.json"

          echo ""
          echo "========================================"
          echo "六组请求验证完成。"

