name: Purge jsDelivr Cache (Best Effort)

on:
  push:
    branches: [main]
    paths:
      - 'xiaohuagames.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 请求 jsDelivr 缓存刷新（尽力而为）
        shell: bash
        run: |
          set -uo pipefail

          URL="https://purge.jsdelivr.net/gh/XHxiaohuaXH/xiaohua-games@main/xiaohuagames.json"
          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT

          echo "请求刷新：$URL"

          CODE=$(curl -sS \
            --max-time 30 \
            --retry 2 \
            --retry-delay 3 \
            -o "$BODY_FILE" \
            -w "%{http_code}" \
            "$URL") || {
              echo "::warning::Purge 请求发生网络错误，跳过刷新。"
              echo "::notice::@main 将按照 jsDelivr 分支缓存策略更新。"
              exit 0
            }

          echo "HTTP 状态码：$CODE"
          echo "响应内容："
          cat "$BODY_FILE"

          if [ "$CODE" != "200" ]; then
            echo "::warning::Purge 请求失败（HTTP $CODE）。"
            echo "::notice::CDN 将按照分支缓存策略更新。"
            exit 0
          fi

          echo "Purge 请求已返回 HTTP 200。"
          echo "::notice::注意：@main 不保证立即刷新，不能据此确认 CDN 已返回最新内容。"
